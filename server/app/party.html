<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>冒險紀錄</title>
<style>
:root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #2a2520; --muted: #7a7065; --line: #e2dbcd;
  --accent: #b5651d; --accent-soft: #f0dcc4; --ok: #3d7a4a; --mark-mix: 74%; --mark-with: #2a2010; --alt-with: #000; --alt-ink: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --panel: #211d17; --ink: #ece5d8; --muted: #9c9182; --line: #3a332a;
          --accent: #e0964a; --accent-soft: #4a3520; --ok: #7fc08a; --mark-mix: 100%; --mark-with: #000; --alt-with: #fff; --alt-ink: #1c1710; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 24px; margin: 0; line-height: 1.25; overflow-wrap: anywhere; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
.sub { color: var(--muted); margin-top: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.hero { position: relative; overflow: hidden; margin-bottom: 14px; }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(560px 220px at 0% 0%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 72%); }
.hero > * { position: relative; }
.live { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px;
  background: var(--ok); color: #fff; margin-left: 8px; vertical-align: middle; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); }
.chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.chip.left { opacity: .55; text-decoration: line-through; }
.chip small { color: var(--muted); margin-left: 4px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c-full { grid-column: 1 / -1; } .c-half { grid-column: span 6; } .c-map { grid-column: span 7; } .c-side { grid-column: span 5; }
@media (max-width: 820px) { .grid > * { grid-column: 1 / -1 !important; } main { padding: 12px 12px 40px; } h1 { font-size: 21px; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile b { display: block; font-size: 23px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12px; color: var(--muted); }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.rank .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .name small { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.lines { list-style: none; margin: 0; padding: 0; } .lines li { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.lines li:first-child { border-top: 0; } .lines .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.lines .num { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines time { color: var(--muted); font-size: 12px; width: 44px; flex: none; padding-top: 2px; font-variant-numeric: tabular-nums; }
.subhead { font-weight: 600; margin: 12px 0 4px; } .subhead:first-of-type { margin-top: 0; }
.xpchart { aspect-ratio: auto; height: 170px; border: 0; border-radius: 0; }
.rank .track { height: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
.rank .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.rank .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
canvas { width: 100%; aspect-ratio: 3 / 2; display: block; border: 1px solid var(--line); border-radius: 8px; }
select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .head h2 { margin: 0; } .head select { margin-left: auto; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.events li:first-child { border-top: 0; }
.events time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft);
  color: var(--accent); margin-right: 6px; font-weight: 600; }
.small { font-size: 12px; color: var(--muted); margin-top: 8px; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.album figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--bg); }
.album img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--line); }
.album figcaption { padding: 6px 8px; font-size: 12px; color: var(--muted); }
.album figcaption b { display: block; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 12px; gap: 10px; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 110px); border-radius: 6px; }
.lightbox .cap { color: #eee; font-size: 14px; text-align: center; }
.lightbox .bar { display: flex; gap: 10px; }
.lightbox button { background: rgba(255, 255, 255, .14); color: #fff; border: 0; border-radius: 99px; padding: 7px 18px; font: inherit; cursor: pointer; }
.loading { padding: 20vh 16px; text-align: center; color: var(--muted); }
.loading i { display: block; width: 38px; height: 38px; margin: 0 auto 14px; border-radius: 50%;
  border: 4px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.more { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 99px; padding: 5px 14px; font: inherit;
  font-size: 13px; cursor: pointer; margin-top: 10px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); flex: none; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; }
.award { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.award .t { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.award .who { font-size: 17px; font-weight: 700; margin: 2px 0; display: flex; align-items: center; overflow-wrap: anywhere; }
.award .why { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tabs button { font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; }
.legend svg { margin-right: 5px; flex: none; }
.chartbox { position: relative; }
.gantt { display: grid; gap: 4px; }
.g-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.g-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-name small { color: var(--muted); margin-left: 6px; font-size: 11px; }
.g-track { position: relative; height: 14px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.g-track i { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; background: var(--ok); }
.g-track i.bad { background: var(--accent); }
.chartbox > svg { display: block; width: 100%; height: 260px; overflow: visible; }
.chartbox text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chartbox text.name { fill: var(--ink); font-size: 12px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); min-width: 150px; }
.tip b { display: block; margin-bottom: 4px; } .tip div { display: flex; align-items: center; gap: 4px; }
.tip div span:last-child { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.tip .boss { color: var(--accent); font-weight: 600; margin-top: 4px; }
.boss-row { display: grid; grid-template-columns: minmax(96px, 30%) 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.boss-row:first-of-type { border-top: 0; }
.boss-row .name { min-width: 0; overflow-wrap: anywhere; font-weight: 600; } .boss-row .name small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.stack { display: flex; gap: 2px; height: 18px; border-radius: 4px; overflow: hidden; }
.stack i { display: block; min-width: 2px; font-style: normal; font-size: 11px; line-height: 18px; text-align: center; color: #1c1710; font-weight: 600; overflow: hidden; }
.boss-row .num { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 22px; }
.kit h3 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; }
.kit .rank li { grid-template-columns: minmax(70px, 40%) 1fr auto; padding: 3px 0; font-size: 13px; }
.kit .rank .track { height: 7px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.pick select { max-width: 100%; min-width: 0; padding: 7px 8px; }
.who-btn { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; }
.who-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; }
.skill .tiles { grid-column: 1 / -1; grid-template-columns: repeat(3, 1fr); }
.skill .tile b small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.donut { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.donut svg { width: 170px; height: 170px; flex: none; }
.donut text.big { font-size: 30px; font-weight: 700; fill: var(--ink); } .donut text.cap { font-size: 12px; fill: var(--muted); }
.donut ul { list-style: none; margin: 0; padding: 0; font-size: 13px; display: grid; gap: 5px; }
.donut li { display: flex; align-items: center; } .donut li small { color: var(--muted); margin-left: 6px; }
.seg-normal { background: #3f86c9; stroke: #3f86c9; } .seg-crit { background: #b57d14; stroke: #b57d14; } .seg-miss { background: #b5404f; stroke: #b5404f; }
.facts { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 14px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.cmp th, table.cmp td { padding: 6px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.cmp thead th { border-top: 0; font-weight: 600; } table.cmp th:first-child { text-align: left; color: var(--muted); font-weight: 400; position: sticky; left: 0; background: var(--panel); }
table.cmp td.best { font-weight: 700; } table.cmp td.best::after { content: " ▲"; color: var(--accent); font-size: 10px; }
table.cmp th .who { display: inline-flex; align-items: center; }
.kit .rank li { cursor: pointer; border-radius: 4px; } .kit .rank li:hover { background: var(--accent-soft); }
.small a { color: var(--accent); }
.dist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 20px; margin-top: 6px; }
.dist h3 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; } .dist h3 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.dist svg { display: block; width: 100%; height: auto; overflow: visible; } .dist text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
table.cmp td small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
table.cmp td.up { background: color-mix(in srgb, #3f86c9 calc(var(--tint) * 1%), transparent); }
table.cmp td.down { background: color-mix(in srgb, #b5404f calc(var(--tint) * 1%), transparent); }
.log { max-height: 340px; overflow-y: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; }
.log table { border-collapse: collapse; width: 100%; font-size: 13px; }
.log th, .log td { padding: 4px 8px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; }
.log thead th { position: sticky; top: 0; background: var(--panel); border-top: 0; color: var(--muted); font-weight: 600; font-size: 12px; }
.log td:last-child, .log th:last-child { text-align: right; font-variant-numeric: tabular-nums; } .log td.t { color: var(--muted); font-variant-numeric: tabular-nums; }
.log tr.in td { color: var(--muted); } .log .crit { font-weight: 700; }
.views { display: flex; gap: 0; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.views button { flex: 1; font: inherit; font-size: 14px; padding: 9px 6px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.views button:first-child { border-left: 0; }
.views button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.views button small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
table.cmp td.thin { color: var(--muted); } table.cmp tr.pickable { cursor: pointer; } table.cmp tr.pickable:hover td, table.cmp tr.pickable:hover th { background: var(--accent-soft); }
table.cmp thead th.sort { cursor: pointer; text-decoration: underline dotted; } table.cmp td.l { text-align: left; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: middle; }
html { scroll-behavior: smooth; }
.grid > section { scroll-margin-top: 54px; }
.nav { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; margin: 0 -16px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); text-decoration: none; white-space: nowrap; }
.nav a.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
details.boss > summary { list-style: none; cursor: pointer; } details.boss > summary::-webkit-details-marker { display: none; }
details.boss { border-top: 1px solid var(--line); } details.boss:first-of-type { border-top: 0; }
details.boss .boss-row { border-top: 0; }
details.boss .name::after { content: "▸"; color: var(--muted); margin-left: 6px; font-weight: 400; }
details.boss[open] .name::after { content: "▾"; }
.boss-more { padding: 0 0 10px; font-size: 13px; display: grid; gap: 4px; }
.boss-more div { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
.boss-more b { font-weight: 600; color: var(--muted); font-size: 12px; width: 3em; flex: none; }
.boss-more span { display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
.cols { display: block; width: 100%; height: 150px; overflow: visible; }
.cols text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.cols rect.bar { fill: var(--accent); } .cols rect.bar:hover, .cols rect.hit:hover + rect.bar { opacity: .75; }
@media (max-width: 560px) {
  main { padding-top: 0; } .nav { margin: 0 -12px 10px; padding: 8px 12px; }
  .card { padding: 14px 12px; } .tile b { font-size: 20px; } .tiles { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .boss-row { grid-template-columns: 1fr auto; row-gap: 5px; }
  .boss-row .name { grid-column: 1 / -1; } .boss-row .name small { display: inline; margin-left: 6px; }
  .tabs button { padding: 6px 12px; } .head { flex-wrap: wrap; row-gap: 8px; }
  .rank li { grid-template-columns: minmax(72px, 34%) 1fr auto; gap: 8px; }
  .chartbox > svg { height: 230px; }
  .events li { grid-template-columns: 42px 1fr; }
  .skill { grid-template-columns: 1fr; } .donut svg { width: 140px; height: 140px; } .who-btn { padding: 7px 12px; }
}
</style>

<body>
<main id="app"><div class="loading" role="status"><i></i>載入紀錄中…</div></main>
<script>
"use strict";
const token = location.pathname.split("/").filter(Boolean).pop();
const API = "/api/v1/shared/party/" + encodeURIComponent(token);
// Through the public address every request costs a few hundred milliseconds of travel, however
// small. These two have fixed addresses and are wanted as soon as the page is drawn, so they are
// asked for together with the session itself instead of after it. Unused when the session has no
// combat log; then they are small and quick.
const early = {};
for (const part of ["research", "skills", "aggro", "auras"]) {
  early[part] = fetch(`${API}/${part}`).then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)));
  early[part].catch(() => {});                 // a failure is handled where it is used
}
const app = document.getElementById("app");
const CLASS = { WARRIOR: "戰士", PALADIN: "聖騎士", HUNTER: "獵人", ROGUE: "盜賊", PRIEST: "牧師", SHAMAN: "薩滿", MAGE: "法師", WARLOCK: "術士", DRUID: "德魯伊" };
const COLOR = { WARRIOR: "#C69B6D", PALADIN: "#F48CBA", HUNTER: "#AAD372", ROGUE: "#E6D94C", PRIEST: "#C9CED6", SHAMAN: "#2E8BE6", MAGE: "#3FC7EB", WARLOCK: "#8788EE", DRUID: "#FF7C0A" };
const LABEL = { PARTY_MEMBER_DIED: "隊友死亡", GROUP_MEMBER_LEVEL_UP: "隊友升級", GROUP_JOINED: "組隊", GROUP_MEMBER_JOINED: "加入", GROUP_MEMBER_LEFT: "離隊", GROUP_LEFT: "解散", MOB_KILLED: "擊殺", ITEM_LOOTED: "拾取",
  PLAYER_DIED: "死亡", LEVEL_UP: "升級", QUEST_ACCEPTED: "接任務", QUEST_COMPLETED: "完成任務", QUEST_REMOVED: "任務移除", ZONE_CHANGED: "換區",
  INSTANCE_ENTERED: "進副本", INSTANCE_LEFT: "離開副本", ENCOUNTER_END: "首領戰", SKILL_UP: "技能", ACHIEVEMENT_EARNED: "成就",
  NPC_INTERACTION: "互動", FLIGHT_STARTED: "起飛", FLIGHT_ENDED: "降落", SESSION_START: "登入" };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}
const dur = s => s >= 3600 ? `${Math.floor(s / 3600)} 小時 ${Math.floor(s % 3600 / 60)} 分` : s >= 60 ? `${Math.floor(s / 60)} 分鐘` : `${s} 秒`;
const money = c => c >= 10000 ? (c / 10000).toFixed(1) + " 金" : c >= 100 ? Math.floor(c / 100) + " 銀" : c + " 銅";
const hm = iso => new Date(iso).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
const day = iso => new Date(iso).toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "short" });

// Names as the game shows them ("亞克 斯迪"), where the server knows them. The data stays keyed by
// the short name; only what is written on the page changes.
let FULL = {};
const N = n => (n && FULL[n]) || n;

function describe(e) {
  if (e.type === "MOB_KILLED") return (e.monster_name || "怪物") + (e.killed_by ? `（${N(e.killed_by)} 擊殺）` : "");
  if (e.type === "ITEM_LOOTED") return (e.item_name || "物品") + (e.count > 1 ? " ×" + e.count : "");
  if (e.type.startsWith("QUEST_")) return e.quest_name || "任務";
  if (e.type === "GROUP_MEMBER_JOINED" || e.type === "GROUP_MEMBER_LEFT" || e.type === "PARTY_MEMBER_DIED") return N(e.name) || "";

    grid.replaceChildren(...parts.map(([, card]) => card));
    nav.replaceChildren(...parts.map(([label, , v], i) => v === view ? el("a", { href: "#s" + i, text: label }) : null).filter(Boolean));
    for (const b of tabs.children) { b.setAttribute("aria-selected", String(b.dataset.view === view)); b.hidden = !parts.some(p => p[2] === b.dataset.view) && b.dataset.view !== "o"; }
    tabs.hidden = [...tabs.children].filter(b => !b.hidden).length < 2;
    if (seen) seen.disconnect();
    seen = new IntersectionObserver(entries => {
      for (const en of entries) if (en.isIntersecting) {
        for (const link of nav.children) link.classList.toggle("on", link.getAttribute("href") === "#" + en.target.id);
        const on = nav.querySelector(".on");
        if (on) nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.clientWidth / 2, behavior: "smooth" });
      }
    }, { rootMargin: "-55px 0px -70% 0px" });
    parts.forEach(([, card, v]) => { if (v === view) seen.observe(card); });
    window.dispatchEvent(new Event("resize"));      // charts drawn while hidden had no width
  };
  const go = v => { view = v; place(); try { history.replaceState(null, "", "#" + v); } catch (e) { /* not allowed here: fine */ } };
  for (const [v, name, hint] of VIEWS) { const b = el("button", { type: "button", role: "tab" }, name, el("small", { text: hint })); b.dataset.view = v; b.addEventListener("click", () => { go(v); window.scrollTo(0, 0); }); tabs.append(b); }
  const jump = openSkill; if (jump) openSkill = (who, k) => { if (view !== "a") go("a"); jump(who, k); };
  app.replaceChildren(hero, tabs, nav, grid,
    el("div", { class: "small c-full", text: `這是 ${N(d.owner.name)} 的插件記錄的內容：擊殺是補最後一擊的次數；經驗、金錢與任務只有 ${N(d.owner.name)} 自己的；傷害、治療與首領戰來自 ${N(d.owner.name)} 電腦上的戰鬥紀錄檔，隊友要在 ${N(d.owner.name)} 附近才記得到。不包含任何聊天內容。`
      + (d.ongoing ? (d.solo ? "這段練功還在進行" : "組隊還在進行") + "，資料會在遊戲存檔後更新。" : "") }));
  if (["a", "r"].includes(location.hash.slice(1)) && parts.some(p => p[2] === location.hash.slice(1))) view = location.hash.slice(1);
  place();
  // The research cards need their own, heavier, numbers: fetched once the page is up.
  if ((d.skills || []).length) early.research.then(R => {
    const more = [["治療", healCard2(R, P), "a"], ["活躍", activityCard(R, P), "a"],
      ["防禦", defenceCard(R, P), "r"], ["怪物", npcCard(R), "r"], ["跨目標", acrossCard(d, P), "r"], ["等級差", gapCard(R), "r"], ["持續傷害", dotCard(R, P), "r"], ["隊員防禦", guardCard(R, P), "r"],
      ["增益", buffCard(R, P), "r"], ["減益", debuffCard(R, P), "r"], ["寵物", petFightCard(R, P), "r"], ["射擊", shotCard(R, P), "r"], ["資源", costCard(R, P), "r"]].filter(([, card]) => card);
    parts.push(...more);
    if (location.hash === "#r" && more.length) view = "r";
    place();
  }).catch(() => {});
  // on the overview, right after the damage numbers, where it is looked for
  early.aggro.then(A => { const card = aggroCard(A, P, d); if (!card) return;
    const after = ["首領", "統計", "傷害", "成果"].map(l => parts.findIndex(p => p[0] === l && p[2] === "o")).find(i => i >= 0);
    parts.splice(after == null ? parts.length : after + 1, 0, ["仇恨", card, "o"]); place(); }).catch(() => {});
  // after the research cards, so the timeline sits with them rather than first
  early.research.catch(() => {}).then(() => early.auras).then(U => { const card = auraCard(U, P, d); if (card) { parts.push(["效果", card, "r"]); place(); } }).catch(() => {});
  if ((d.skills || []).length) app.append(el("div", { class: "small" }, el("a", { href: API + "/hits.csv", text: "下載這場的逐筆戰鬥紀錄（CSV，可用試算表開啟）" }), "　", el("a", { href: API + "/hits.json", text: "JSON" })));
}

fetch(API).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status === 404 ? "找不到這場紀錄，連結可能有誤。" : "伺服器回應 " + r.status)))
  .then(render)
  .catch(e => app.replaceChildren(el("div", { class: "loading", text: e.message === "Failed to fetch" ? "連不上伺服器，請稍後再試。" : e.message })));
</script>
</body>
</html>
