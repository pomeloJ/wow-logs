<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>下載 AdventureSync</title>
<style>
:root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #2a2520; --muted: #7a7065; --line: #e2dbcd; --accent: #b5651d; --accent-ink: #fff; --accent-soft: #f0dcc4; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --panel: #211d17; --ink: #ece5d8; --muted: #9c9182; --line: #3a332a; --accent: #e0964a; --accent-ink: #1c1710; --accent-soft: #4a3520; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 620px; margin: 0 auto; padding: 48px 20px 64px; }
a { color: var(--accent); }

header { text-align: center; margin-bottom: 28px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: .01em; }
header p { margin: 0; color: var(--muted); }

.get { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; text-align: center;
  background-image: radial-gradient(420px 160px at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 75%); }
.get a.main { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; text-decoration: none;
  padding: 13px 34px; border-radius: 10px; }
.get a.main:hover { filter: brightness(1.06); }
.get .about { color: var(--muted); font-size: 14px; margin: 10px 0 0; min-height: 1.6em; }
.others { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line);
  font-size: 14px; list-style: none; }
.others small { color: var(--muted); }

h2 { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .08em; margin: 36px 0 12px; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 10px; }
ol.steps > li { counter-increment: step; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 56px; position: relative; }
ol.steps > li::before { content: counter(step); position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
ol.steps b { font-weight: 700; }
ol.steps small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
ol.steps .copy + small, ol.steps small + small { margin-top: 8px; }
.copy { display: flex; gap: 8px; margin-top: 8px; }
.copy code { flex: 1; min-width: 0; overflow-wrap: anywhere; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; user-select: all; }
.copy button { font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; white-space: nowrap; }
kbd { font: inherit; font-weight: 600; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
@media (max-width: 480px) { main { padding: 28px 14px 48px; } h1 { font-size: 25px; } .get { padding: 22px 16px; } .get a.main { display: block; padding: 13px 16px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>AdventureSync</h1>
    <p>裝在玩遊戲的電腦上，把冒險紀錄送到這台伺服器。</p>
  </header>

  <section class="get" aria-label="下載">
    <a class="main" id="main" href="/download/client-source.zip">下載</a>
    <p class="about" id="about"></p>
    <ul class="others" id="others"></ul>
  </section>

  <h2>三個步驟</h2>
  <ol class="steps">
    <li><b>打開程式</b>
      <small id="open">系統會提醒這是未簽署的程式。</small></li>
    <li><b>填入伺服器網址和你的權杖</b>
      <div class="copy"><code id="url"></code><button type="button" data-copy="url">複製</button></div>
      <small>權杖向伺服器的主人要。一個人一個，你的每個角色都用同一個。</small></li>
    <li><b>按 <kbd>安裝插件到遊戲</kbd>，再按 <kbd>開始自動同步</kbd></b>
      <small>進遊戲後按畫面上方的「存檔」，資料才會送出。</small>
      <small>要有傷害統計，在遊戲的聊天輸入框輸入下面這行，再按 Enter：</small>
      <div class="copy"><code id="cmd">/combatlog</code><button type="button" data-copy="cmd">複製</button></div></li>
  </ol>

  <footer>之後有新版本，程式會自己提示。</footer>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) k === "text" ? n.textContent = v : n.setAttribute(k, v); n.append(...kids); return n; };
const windows = /Win/i.test(navigator.platform || navigator.userAgent), mac = /Mac/i.test(navigator.platform || navigator.userAgent);
const size = n => n >= 1048576 ? Math.round(n / 1048576) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
// A ready-made program is named after its system.
const kind = name => /win|\.exe$/i.test(name) ? "Windows" : /mac|darwin|osx|\.dmg$|\.pkg$/i.test(name) ? "macOS" : "";

$("url").textContent = location.origin;
// Each "copy" button copies exactly what is in the box beside it, nothing around it.
for (const button of document.querySelectorAll("button[data-copy]")) button.addEventListener("click", () => {
  const box = $(button.dataset.copy), text = box.textContent;
  const done = () => { button.textContent = "已複製"; setTimeout(() => { button.textContent = "複製"; }, 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => {});
  else { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); try { document.execCommand("copy"); done(); } catch (e) { /* left selected to copy by hand */ } }
});
$("open").textContent = windows ? "Windows 會提醒這是未簽署的程式：選「其他資訊 → 仍要執行」。"
  : mac ? "先解壓縮。macOS 會擋下未簽署的程式：在檔案上按右鍵選「打開」。" : "系統提醒這是未簽署的程式時，選擇仍要開啟。";

// The big button is the ready-made program for this computer; everything else is a small link below it.
function show(r) {
  const builds = r.builds || [], mine = builds.find(b => (windows && kind(b.name) === "Windows") || (mac && kind(b.name) === "macOS"));
  // A file keeps its name from one version to the next. The version in the address makes sure it is this
  // version that arrives, not a copy of an older one kept by something in front of the server.
  const fresh = (v, n) => v ? "?v=" + encodeURIComponent(v + (n ? "-" + n : "")) : "";
  const link = b => "/download/builds/" + encodeURIComponent(b.name) + fresh(b.version || b.updated, b.size), ver = v => v ? " " + v : "";
  const source = "/download/client-source.zip" + fresh(r.source_version), addon = "/download/addon.zip" + fresh(r.addon_version);
  if (mine) {
    $("main").href = link(mine); $("main").textContent = `下載 ${kind(mine.name)} 版`;
    $("about").textContent = `版本${ver(mine.version) || " —"}　${size(mine.size)}　不需要安裝其他東西`;
  } else if (r.source) {
    $("main").href = source; $("main").textContent = "下載原始碼版";
    $("about").replaceChildren(`${windows || mac ? "這台伺服器還沒有" + (windows ? " Windows" : " macOS") + " 的免安裝版。" : ""}原始碼版需要先裝 `,
      el("a", { href: "https://www.python.org/downloads/", rel: "noreferrer", text: "Python 3.11 以上" }), "。");
  } else {
    $("main").remove(); $("about").textContent = "這台伺服器上目前沒有可以下載的程式。";
  }
  const rest = builds.filter(b => b !== mine).map(b => el("li", null, el("a", { href: link(b), text: (kind(b.name) || b.name) + " 版" }), el("small", { text: ver(b.version) })));
  if (r.source && mine) rest.push(el("li", null, el("a", { href: source, text: "原始碼版" }), el("small", { text: `${ver(r.source_version)}（需要 Python）` })));
  rest.push(el("li", null, el("a", { href: addon, text: "只要遊戲插件" }), el("small", { text: ver(r.addon_version) })));
  $("others").replaceChildren(...rest);
}
fetch("/api/v1/setup").then(r => r.json()).then(show).catch(() => show({ builds: [], source: true }));
</script>
</body>
</html>
