<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure Hub</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #2a2520; --muted: #7a7065; --line: #e2dbcd;
  --accent: #b5651d; --accent-soft: #f0dcc4; --ok: #3d7a4a; --warn: #b3541e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --panel: #211d17; --ink: #ece5d8; --muted: #9c9182; --line: #3a332a;
          --accent: #e0964a; --accent-soft: #4a3520; --ok: #7fc08a; --warn: #e89a6a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
.sync { margin-left: auto; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.dot.stale { background: var(--warn); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.c-char { grid-column: span 5; } .c-stats { grid-column: span 7; }
.c-map { grid-column: span 7; } .c-events { grid-column: span 5; }
.c-half { grid-column: span 6; } .c-third { grid-column: span 4; } .c-full { grid-column: 1 / -1; }
.pbar { display: inline-block; width: 110px; height: 7px; border-radius: 99px; background: var(--line); overflow: hidden;
  position: relative; flex: none; align-self: center; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.pbar.ok i { background: var(--ok); } .pbar.low i { background: var(--warn); }
.pbar.sm { width: 70px; height: 5px; vertical-align: middle; margin-left: 8px; }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.rank .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .track { height: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
.rank .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.rank .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 2.5em; text-align: right; }
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .summary { grid-template-columns: 1fr; } }
.xpchart { aspect-ratio: auto; height: 170px; border: 0; border-radius: 0; }
.estimate { font-size: 14px; margin-top: 8px; } .estimate b { color: var(--accent); }
@media (max-width: 820px) { .card { grid-column: 1 / -1 !important; } }
.hero { grid-column: 1 / -1; display: flex; gap: 18px; align-items: center; position: relative; overflow: hidden; margin-bottom: 4px; }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(520px 220px at 0% 0%, color-mix(in srgb, var(--cls, var(--accent)) 26%, transparent), transparent 72%); }
.hero > * { position: relative; }
.ring { width: 104px; height: 104px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--line); } .ring .rest { stroke: var(--accent-soft); }
.ring .fg { stroke: var(--cls, var(--accent)); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring .lv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring .lv b { font-size: 34px; font-variant-numeric: tabular-nums; } .ring .lv span { font-size: 11px; color: var(--muted); }
.hero .who { min-width: 0; flex: 1; }
.hero .name { color: var(--cls, var(--ink)); overflow-wrap: anywhere; }
@media (prefers-color-scheme: light) { .hero .name { color: color-mix(in srgb, var(--cls, var(--ink)) 60%, #000); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg);
  white-space: nowrap; font-variant-numeric: tabular-nums; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip b { font-weight: 600; color: var(--muted); margin-right: 4px; }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; margin: 4px 0 6px;
  background: var(--bg); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 7px 16px;
  white-space: nowrap; flex: none; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.grid > [data-tab]:not(.on) { display: none; }
.chars { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chars::-webkit-scrollbar { display: none; }
.chars button { display: flex; align-items: center; gap: 7px; flex: none; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px 6px 9px; font-size: 14px; white-space: nowrap; cursor: pointer; }
.chars button i { width: 9px; height: 9px; border-radius: 50%; background: var(--cls, var(--muted)); flex: none; }
.chars button small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chars button[aria-pressed="true"] { border-color: var(--cls, var(--accent)); box-shadow: inset 0 0 0 1px var(--cls, var(--accent)); font-weight: 600; }
.search { margin: 0 0 8px; }
@media (max-width: 820px) {
  main { padding: 12px 12px 40px; }
  .sync { margin-left: 0; flex-basis: 100%; order: 3; }
  header #logout { margin-left: auto; }
  .card { padding: 14px; }
  .rows, .events { max-height: none; }
  .btn, select { padding: 8px 12px; }
  .mapctl input[type=range] { flex-basis: 100%; order: -1; height: 28px; }
  .tile b { font-size: 21px; }
  .rank li, .rank li.x summary { grid-template-columns: minmax(80px, 42%) 1fr auto; }
}
@media (max-width: 480px) {
  .hero { gap: 12px; } .ring { width: 84px; height: 84px; } .ring .lv b { font-size: 27px; }
  .hero .name { font-size: 22px; }
  .rows li { flex-wrap: wrap; } .rows .num { margin-left: auto; }
  dl { grid-template-columns: 1fr; gap: 0 0; } dd { margin-bottom: 8px; }
}
.name { font-size: 26px; font-weight: 700; line-height: 1.2; }
.sub { color: var(--muted); margin-top: 2px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; }
dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12px; color: var(--muted); }
.maphead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.maphead h2 { margin: 0; }
select { margin-left: auto; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 60%; }
canvas { width: 100%; aspect-ratio: 3 / 2; display: block; border: 1px solid var(--line); border-radius: 8px; }
.mapctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.mapctl input[type=range] { flex: 1; min-width: 120px; margin: 0; padding: 0; accent-color: var(--accent); }
.mapctl select { margin-left: 0; max-width: none; }
.btn { background: none; color: var(--ink); border: 1px solid var(--line); padding: 4px 12px; white-space: nowrap; }
.legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
.events { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow: auto; }
.events li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.events li:first-child { border-top: 0; }
.events time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); margin-right: 6px; font-weight: 600; }
.detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 14px 0 4px; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.bar i.rest { background: var(--accent-soft); }
.small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
.rows:has(details[open]) { max-height: none; }
@media (max-width: 820px) { .rows, .events { max-height: none !important; } }
.rows li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rows .num { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
.q0 { color: var(--muted); } .q2 { color: #2f9e44; } .q3 { color: #3b82c4; } .q4 { color: #9b5de5; } .q5 { color: #e8890c; }
.done { color: var(--ok); } .obj { display: block; font-size: 12px; color: var(--muted); }
.cardhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.cardhead h2 { margin: 0; } .cardhead .small { margin-left: auto; }
details.grow > summary { display: flex; gap: 10px; align-items: baseline; cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary:hover .wname { text-decoration: underline; }
.rank li.x { display: block; }
.rank li.x summary { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
/* An opened row becomes one framed block: tinted header on top, details panel below, so it
   reads as a unit and does not run into the next row. */
.wbox { margin: 0 0 10px; padding: 10px 12px 12px; font-size: 13px; color: var(--muted); background: var(--bg);
  border: 1px solid var(--line); border-top: 0; border-left: 3px solid var(--accent); border-radius: 0 0 8px 8px; }
details.grow > summary::before { content: "▸"; color: var(--muted); flex: none; width: 1em; transition: transform .15s; align-self: center; }
details.grow[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
.rank li.x summary::before { display: none; }
details.grow[open] > summary { background: var(--accent-soft); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-bottom-style: dashed; border-radius: 8px 8px 0 0; padding: 8px 10px 8px 9px; margin-top: 4px; }
details.grow[open] > summary .wname { font-weight: 600; }
.rows li:has(> details[open]) { border-top-color: transparent; padding-top: 2px; }
.rows li:has(> details[open]) + li { border-top-color: transparent; }
.wbox .wbox { background: var(--panel); }
.wbox details.grow[open] > summary { background: var(--panel); }
.wbox details.grow:not([open]) > summary { padding: 4px 0; border-top: 1px dashed var(--line); }
.wbox div { padding: 1px 0; overflow-wrap: anywhere; } .wbox b { color: var(--ink); font-weight: 600; }
.foot { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: center; }
#busy { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 20; overflow: hidden; opacity: 0; transition: opacity .2s; pointer-events: none; }
#busy.on { opacity: 1; }
#busy::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--accent); border-radius: 3px;
  animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { padding: 18vh 16px; text-align: center; color: var(--muted); }
.loading i { display: block; width: 38px; height: 38px; margin: 0 auto 14px; border-radius: 50%;
  border: 4px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
.loading small { display: block; margin-top: 6px; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .loading i, #busy::before { animation-duration: 3s; } }
.wsec { font-weight: 600; color: var(--ink); margin-top: 8px; }
.timerange { margin: 0 0 10px; } .timerange input { width: auto; flex: 1; min-width: 170px; margin: 0; padding: 5px 8px; }
.legbar[hidden], .timerange[hidden] { display: none; }
.legbar { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 4px; align-items: center; scrollbar-width: thin; }
.legbar .chip { cursor: pointer; color: var(--ink); font: inherit; font-size: 12px; flex: none; }
.legbar .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.legbar .chip[aria-pressed="true"] b { color: #fff; }
.legbar .arrow { color: var(--muted); flex: none; font-size: 12px; }
.zbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); width: 110px; flex: none; align-self: center; }
.zbar i { display: block; height: 100%; } .zbar .d { background: var(--ok); } .zbar .l { background: var(--accent); } .zbar .a { background: var(--accent-soft); }
.zone { cursor: pointer; border-radius: 6px; padding-left: 6px !important; padding-right: 6px !important; }
.zone:hover { background: var(--bg); } .zone.sel { background: var(--accent-soft); }
.zone.here .grow > span:first-child::after { content: " · 你在這裡"; color: var(--accent); font-size: 12px; }
.note { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); margin-bottom: 8px; }
.xp s { color: var(--muted); margin-right: 4px; }
@media (max-width: 480px) { .zbar { width: 64px; } }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 4.2em auto; gap: 8px; align-items: center; padding: 5px 0 !important;
  border-top: 1px dashed var(--line); }
.srow.plain { grid-template-columns: minmax(0, 1fr) auto; }
.srow .sname { min-width: 0; color: var(--ink); } .srow .obj { margin-top: 1px; }
.srow .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.srow .pct.unk { color: var(--muted); font-size: 12px; }
.cbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
.cbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; min-width: 3px; }
.cbar.unk { background: repeating-linear-gradient(135deg, var(--line) 0 4px, transparent 4px 8px); }
.btn.sm { padding: 2px 10px; font-size: 12px; border-radius: 99px; }
.btn.sm[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.mini { margin: 4px 0 10px; } .mini canvas { max-width: 540px; } .mini .chips { margin: 0 0 6px; }
.mini .chip { cursor: pointer; color: var(--ink); font: inherit; font-size: 12px; }
.mini .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (max-width: 480px) { .srow { grid-template-columns: minmax(0, 1fr) 48px 3.6em auto; gap: 6px; } }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.album figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--bg); }
.album img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--line); }
.album figcaption { padding: 6px 8px; font-size: 12px; color: var(--muted); }
.album figcaption b { display: block; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 12px; gap: 10px; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 110px); border-radius: 6px; }
.lightbox .cap { color: #eee; font-size: 14px; text-align: center; }
.lightbox .bar { display: flex; gap: 10px; }
.lightbox button { background: rgba(255, 255, 255, .14); color: #fff; border: 0; border-radius: 99px; padding: 7px 18px; font: inherit; cursor: pointer; }
.msg { padding: 40px 16px; text-align: center; color: var(--muted); } .msg button { margin-top: 14px; }
.login { max-width: 420px; margin: 12vh auto; }
input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); margin: 10px 0; }
button { font: inherit; padding: 7px 16px; border: 0; border-radius: 6px; background: var(--accent);
  color: #fff; cursor: pointer; }
button.link { background: none; color: var(--muted); padding: 0; font-size: 13px; text-decoration: underline; }
.google { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.gbtn { display: inline-block; padding: 7px 16px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-decoration: none; }
.gbtn:hover { border-color: var(--accent); }
.shade { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-start;
  justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.sheet { width: 100%; max-width: 620px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.sheet-head h2 { margin: 0; font-size: 16px; color: var(--ink); letter-spacing: 0; }
.tk { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.tk h3 { font-size: 14px; margin: 0 0 4px; }
.tk .tkhint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.tk code { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; overflow-wrap: anywhere; }
.tk .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.tk .row:last-of-type { border-bottom: 0; }
.tk .row .what { flex: 1 1 160px; min-width: 0; }
.tk .row .what small { display: block; color: var(--muted); font-size: 12px; }
.tk button.small { padding: 4px 10px; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.tk button.small:hover { border-color: var(--accent); }
.tk button.small.danger { color: var(--warn); }
.tk form { display: flex; gap: 8px; margin-top: 10px; align-items: center; } .tk form input { margin: 0; flex: 1 1 auto; min-width: 0; }
.tk form button { flex: none; white-space: nowrap; }
.tk .say { font-size: 13px; min-height: 1.2em; margin-top: 6px; color: var(--warn); }
.tk .row.fresh { background: var(--accent-soft); border-radius: 6px; padding: 8px; }   /* the one just made
*/
.sheet > .say { font-size: 13px; min-height: 1.2em; margin-top: 10px; color: var(--warn); }
.tk .what code { display: inline-block; margin: 3px 0; }
.tk .shows { display: block; color: var(--muted); font-size: 12px; }
.tk .parts { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 10px; margin-top: 4px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
.tk .parts[hidden] { display: none; }
.tk .parts label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.tk .parts input { width: auto; margin: 0; }
.tk .parts .always { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.tk .parts button { margin-left: auto; padding: 4px 12px; font-size: 13px; }
.sharenote { margin-bottom: 12px; font-size: 13px; color: var(--muted); padding: 10px 14px; }
.friendbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 14px;
  border-color: var(--accent); background: var(--accent-soft); font-size: 14px; }
.friendbar b { color: var(--accent); }
.friendbar button { margin-left: auto; padding: 4px 12px; font-size: 13px; }
.tk .who { display: flex; align-items: center; gap: 10px; }
.tk .who img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.tk .parts .group { flex-basis: 100%; font-weight: 600; color: var(--muted); font-size: 12px; margin-top: 4px; }
.tk .parts label.off { opacity: .45; }
.invite-from { display: flex; align-items: center; gap: 12px; margin: 14px 0; font-size: 15px; }
.invite-from img { width: 44px; height: 44px; border-radius: 50%; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
/* token and friend panels: one bordered card per item, actions along its foot */
/* the token panel: one kind of token per tab, each token a card of labelled rows */
.sheet.tokens { max-width: 680px; }

<body>
<main>
  <header>
    <h1>Adventure Hub</h1>
    <span class="sync" id="sync"></span>
    <button class="link" id="friends" hidden>好友</button>
    <button class="link" id="tokens" hidden>管理權杖</button>
    <button class="link" id="logout" hidden>登出</button>
  </header>
  <div id="busy" role="progressbar" aria-label="載入中"></div>
  <div id="app"><div class="loading" role="status"><i></i>載入冒險紀錄中…<small id="slow" hidden>伺服器回應比較慢，請再等一下。</small></div></div>
</main>
<script>
"use strict";
const API = "/api/v1";
const KEY = "adventure-hub-token";
const CLASS = { WARRIOR: "戰士", PALADIN: "聖騎士", HUNTER: "獵人", ROGUE: "盜賊", PRIEST: "牧師",
  SHAMAN: "薩滿", MAGE: "法師", WARLOCK: "術士", DRUID: "德魯伊", DEATHKNIGHT: "死亡騎士", MONK: "武僧" };
const RACE = { Human: "人類", Dwarf: "矮人", NightElf: "夜精靈", Gnome: "地精", Orc: "獸人",
  Scourge: "不死族", Tauren: "牛頭人", Troll: "食人妖", BloodElf: "血精靈", Draenei: "德萊尼" };
const FACTION = { Alliance: "聯盟", Horde: "部落" };
const EVENT = { LOCATION_SAMPLE: "位置", ZONE_CHANGED: "換區", LEVEL_UP: "升級", SESSION_START: "登入",
  QUEST_ACCEPTED: "接任務", QUEST_COMPLETED: "完成任務", QUEST_REMOVED: "任務移除", PLAYER_DIED: "死亡",
  ITEM_LOOTED: "拾取", MOB_KILLED: "擊殺", MAP_SCREENSHOT: "地圖截圖", MONEY_CHANGED: "金錢", XP_GAINED: "經驗",
  SKILL_UP: "技能提升", GROUP_JOINED: "組隊", GROUP_LEFT: "隊伍解散", GROUP_MEMBER_JOINED: "隊友加入", GROUP_MEMBER_LEFT: "隊友離隊",
  PARTY_LOOT: "隊友拾取", PARTY_MEMBER_DIED: "隊友死亡", GROUP_MEMBER_LEVEL_UP: "隊友升級", PARTY_POSITIONS: "隊友位置", GROUP_METER: "傷害統計", GROUP_ENCOUNTER: "首領戰統計", THREAT: "仇恨", TRADE_COMPLETED: "交易", COMBAT: "戰鬥", INSTANCE_ENTERED: "進副本", INSTANCE_LEFT: "離開副本", ENCOUNTER_END: "首領戰",
  NPC_INTERACTION: "互動", ACHIEVEMENT_EARNED: "成就", FLIGHT_STARTED: "起飛", FLIGHT_ENDED: "降落", CHAT_MESSAGE: "聊天" };
const NPC_KIND = { merchant: "商人", trainer: "訓練師", mailbox: "信箱", bank: "銀行", auction: "拍賣場", flightmaster: "飛行管理員" };
const CHANNEL = { say: "說", yell: "喊", party: "隊伍", raid: "團隊", guild: "公會", whisper: "密語", general: "綜合", trade: "交易", other_channels: "頻道" };
const STANDING = { 1: "仇恨", 2: "敵對", 3: "冷淡", 4: "中立", 5: "友善", 6: "尊敬", 7: "崇敬", 8: "崇拜" };
const STAT = { strength: "力量", agility: "敏捷", stamina: "耐力", intellect: "智力", spirit: "精神", armor: "護甲", health_max: "生命上限", power_max: "能量上限" };
const duration = s => s >= 3600 ? `${Math.floor(s / 3600)} 小時 ${Math.floor(s % 3600 / 60)} 分` : s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
const SLOT = { 1: "頭部", 2: "頸部", 3: "肩部", 4: "襯衣", 5: "胸部", 6: "腰部", 7: "腿部", 8: "腳", 9: "手腕",
  10: "手", 11: "戒指", 12: "戒指", 13: "飾品", 14: "飾品", 15: "背部", 16: "主手", 17: "副手", 18: "遠程", 19: "外袍" };
const list = v => Array.isArray(v) ? v : [];
const CLASS_COLOR = { WARRIOR: "#C69B6D", PALADIN: "#F48CBA", HUNTER: "#AAD372", ROGUE: "#E6D94C", PRIEST: "#C9CED6",
  SHAMAN: "#2E8BE6", MAGE: "#3FC7EB", WARLOCK: "#8788EE", DRUID: "#FF7C0A" };
// The album (screenshots) is built further down but has no tab for now: hidden on request.
// To bring it back, add ["album", "相簿"] to this list.
const TABS = [["home", "總覽"], ["map", "地圖"], ["quests", "任務"], ["items", "物品"], ["char", "角色"], ["data", "資料"]];
const TAB_KEY = "adventure-hub-tab";
const CHAR_KEY = "adventure-hub-character";      // the character last looked at, per browser

let token = "";
// Signed in with a Google account that is bound to a token: requests carry the sign-in cookie
// instead of a token. A token, when there is one, always wins.
let session = false;
// The token arrives after the "#": written out as #token=abc, or just #abc. Either replaces
// the one this browser remembered, so a link always shows what that link is for.
function takeToken() {
  const m = location.hash.match(/token=([^&]+)/) || location.hash.match(/^#([A-Za-z0-9_-]{8,})$/);
  if (!m) return false;
  localStorage.setItem(KEY, decodeURIComponent(m[1]));
  history.replaceState(null, "", location.pathname);
  return true;
}
// A friend invite arrives the same way, as #friend=CODE: kept in this browser until its owner
// is signed in with Google (which leaves the page and comes back), then asked about once.
const INVITE_KEY = "adventure-hub-friend-invite";
function takeInvite() {
  const m = location.hash.match(/friend=([A-Za-z0-9_-]{4,64})/);
  if (!m) return false;
  localStorage.setItem(INVITE_KEY, m[1]);
  history.replaceState(null, "", location.pathname);
  return true;
}
// Opening a link in a tab that already shows the page changes only the "#": start over with it.
window.addEventListener("hashchange", () => { try { if (takeInvite() || takeToken()) location.reload(); } catch (e) { /* storage unavailable */ } });
try {
  takeInvite();
  takeToken();
  token = localStorage.getItem(KEY) || "";
} catch (e) { /* storage unavailable: fall through to the token form */ }

const app = document.getElementById("app");
// The parts a sharing token shows (null: everything); the page leaves out the rest.
const has = part => !state.parts || state.parts.has(part);
const state = { friend: null, mine: null, parts: null, charId: null, mapId: null, locs: [], maps: {}, filter: "activity", range: "today", tab: "home", pins: [], redraw: null };
try { const t = localStorage.getItem(TAB_KEY); if (TABS.some(x => x[0] === t)) state.tab = t; } catch (e) { /* default tab */ }
try { state.charId = localStorage.getItem(CHAR_KEY); } catch (e) { /* the one played last */ }

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}

// Looking at a friend's characters: the sign-in cookie and the friend's id, never the token.
const auth = () => state.friend ? { "X-Friend": state.friend.id } : token ? { Authorization: "Bearer " + token } : {};
async function whoAmI() {
  try { const r = await fetch(API + "/me"); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

async function get(path) {
  const r = await fetch(API + path, { headers: auth() });
  if (r.status === 403) {
    // a sharing token limited to some parts says which one it does not show: that is no failed sign-in
    const why = await r.json().catch(() => null);
    if (why && why.detail && why.detail.hidden) throw new Error("hidden");
  }
  if (r.status === 401 || r.status === 403) throw new Error("auth");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return "剛剛";
  if (s < 3600) return Math.round(s / 60) + " 分鐘前";
  if (s < 86400) return Math.round(s / 3600) + " 小時前";
  return Math.round(s / 86400) + " 天前";
}
const hm = iso => new Date(iso).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
const full = iso => new Date(iso).toLocaleString("zh-TW", { hour12: false });
function money(c) {
  if (typeof c !== "number") return "—";
  return `${Math.floor(c / 10000)} 金 ${Math.floor(c % 10000 / 100)} 銀 ${c % 100} 銅`;
}
const pos = d => (typeof d.x === "number" && typeof d.y === "number") ? `${d.x.toFixed(1)}, ${d.y.toFixed(1)}` : "—";

// me: what /api/v1/me said, when already asked. Signed in with Google but not bound yet, the
// form binds the account instead: the token is pasted once, and Google sign-in is enough after.
function showLogin(failed, me) {
  session = false;
  document.getElementById("logout").hidden = true;
  document.getElementById("tokens").hidden = true;
  document.getElementById("friends").hidden = true;
  state.friend = null;
  document.getElementById("sync").textContent = "";
  const binding = !!(me && me.account && !me.link);
  const input = el("input", { type: "password", placeholder: "Token", autocomplete: "off" });
  const note = el("div", { class: "detail", text: binding
    ? `已用 Google 帳號 ${me.account.email} 登入。第一次使用請貼上你的 Token（同步程式裡的那串）綁定這個帳號，之後只要用 Google 登入就好。`
    : failed ? "Token 無效，請重新輸入。" : "請貼上唯讀 Token（只會存在這個瀏覽器）。" });
  let waiting = null;
  try { waiting = localStorage.getItem(INVITE_KEY); } catch (e) { /* none */ }
  if (waiting) note.textContent = "你收到一個好友邀請：請先用 Google 登入" + (binding ? "並綁定權杖" : "") + "，之後會再問你要不要接受。　" + note.textContent;
  const form = el("form", { class: "card login" },
    el("h2", { text: binding ? "綁定 Google 帳號" : "需要存取 Token" }), note,
    input, el("button", { text: binding ? "綁定並進入" : "進入" }));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const typed = input.value.trim();
    if (!typed) return;
    if (binding) {
      let r = null;
      try { r = await fetch(API + "/me/link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: typed }) }); } catch (err) { /* below */ }
      if (!r || !r.ok) {
        note.textContent = !r ? "連不上伺服器，請稍後再試。" : r.status === 400 ? "這是語音頁面用的角色代碼，請貼同步程式裡的 Token。"
          : r.status === 401 ? "Google 登入已過期，請重新整理頁面再登入一次。" : "Token 無效，請重新輸入。";
        return;
      }
      token = "";
      session = true;
      try { localStorage.removeItem(KEY); } catch (err) { /* nothing stored */ }
    } else {
      token = typed;
      try { localStorage.setItem(KEY, token); } catch (err) { /* keep in memory only */ }
    }
    app.replaceChildren(el("div", { class: "loading", role: "status" }, el("i"), "載入冒險紀錄中…"));
    load();
  });
  app.replaceChildren(form);
  googleBox(form, me);
}

// Signing in with Google, when the server has it set up. It tells the site who is at the
// browser; what a Google account may see comes later (tied to a person's token), so the
// token is still what opens the page for now.
async function googleBox(form, me) {
  if (me === undefined) me = await whoAmI();
  if (!me || !me.google || !form.isConnected) return;
  const box = el("div", { class: "detail google" });
  if (me.account) {
    const out = el("button", { type: "button", class: "link", text: "登出 Google" });
    out.addEventListener("click", async () => {
      try { await fetch("/auth/logout", { method: "POST" }); } catch (e) { /* the cookie lapses by itself */ }
      showLogin(false, await whoAmI());
    });
    box.append(me.link ? `已用 Google 帳號 ${me.account.email} 登入。` : "不想綁定的話，可以登出 Google，改用 Token 進入。", " ", out);
  } else {
    box.append(el("a", { class: "gbtn", href: "/auth/google/start?next=/" }, "用 Google 登入", el("span", { class: "beta", text: "BETA" })));
  }
  form.append(box);
}

// ---- dialogs shared by the token and friend panels
function sheet(label) {
  const shade = el("div", { class: "shade" });
  const box = el("div", { class: "card sheet", role: "dialog", "aria-modal": "true", "aria-label": label });
  shade.append(box);
  const close = () => { shade.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape" && !document.querySelector(".shade.ask")) close(); };
  shade.addEventListener("click", e => { if (e.target === shade) close(); });
  document.addEventListener("keydown", esc);
  document.body.append(shade);
  const shut = el("button", { type: "button", class: "link", text: "關閉" });
  shut.addEventListener("click", close);
  return { box, close, head: el("div", { class: "sheet-head" }, el("h2", { text: label }), shut) };
}

// "Are you sure?" with the usual two buttons: resolves true only for the confirming one.
function confirmBox({ title, text, ok, danger }) {
  return new Promise(done => {
    const shade = el("div", { class: "shade ask" });
    const no = el("button", { type: "button", class: "btn2", text: "取消" });
    const yes = el("button", { type: "button", class: "btn2 " + (danger ? "bad" : "go"), text: ok });
    const box = el("div", { class: "card ask-box", role: "alertdialog", "aria-modal": "true", "aria-label": title },
      el("h3", { text: title }), el("p", { text }), el("div", { class: "acts" }, no, yes));
    shade.append(box);
    const finish = v => { shade.remove(); document.removeEventListener("keydown", key); done(v); };
    const key = e => { if (e.key === "Escape") { e.stopPropagation(); finish(false); } };
    no.addEventListener("click", () => finish(false));
    yes.addEventListener("click", () => finish(true));
    shade.addEventListener("click", e => { if (e.target === shade) finish(false); });
    document.addEventListener("keydown", key, true);
    document.body.append(shade);
    no.focus();
  });
}

function copyButton(text, label, primary) {
  const b = el("button", { type: "button", class: "btn2" + (primary ? " go" : ""), text: label });
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); b.textContent = "✓ 已複製"; setTimeout(() => { b.textContent = label; }, 1400); }

// ---- friends: other Google accounts that see each other's characters, each choosing what it shows
document.getElementById("friends").addEventListener("click", () => friendsPanel());

function viewFriend(f) {
  if (!state.friend) state.mine = state.charId;      // to come back to the same character
  state.friend = { id: f.id, name: f.name, sections: f.shown.sections };
  state.charId = null;
  app.replaceChildren(el("div", { class: "loading", role: "status" }, el("i"), "載入 " + f.name + " 的角色…"));
  window.scrollTo(0, 0);
  load();
}

function leaveFriend() {
  state.friend = null;
  state.charId = state.mine;
  state.parts = null;
  load();
}

async function friendCall(method, path, body) {
  const r = await fetch(API + "/me/friends" + path, { method, body: body ? JSON.stringify(body) : undefined,
    headers: body ? { "Content-Type": "application/json" } : {} });
  if (!r.ok) throw new Error(r.status === 409 ? "已達上限，或不能邀請自己。" : r.status === 401 ? "Google 登入已過期，請重新登入。"
    : r.status === 403 ? "這個 Google 帳號還沒綁定權杖。" : r.status === 404 ? "這個邀請已經用過或過期了，請對方再產生一個。" : "伺服器回應 " + r.status);
  return r.json();
}

// asked once after signing in, when this browser was given an invite link
let asking = false;
async function askAboutInvite() {
  let code = null;
  try { code = localStorage.getItem(INVITE_KEY); } catch (e) { return; }
  if (!code || asking) return;
  asking = true;
  try { localStorage.removeItem(INVITE_KEY); } catch (e) { /* asked once anyway */ }
  const s = sheet("好友邀請");
  const body = el("div");
  s.box.replaceChildren(s.head, body);
  const done = () => { s.close(); asking = false; };
  let info;
  try { info = await friendCall("GET", "/invite/" + encodeURIComponent(code)); }
  catch (e) { body.replaceChildren(el("p", { class: "detail", text: e.message })); asking = false; return; }
  const from = el("div", { class: "invite-from" }, info.from.picture ? el("img", { src: info.from.picture, alt: "", referrerpolicy: "no-referrer" }) : null,
    el("b", { text: info.from.name }));
  if (info.self || info.already) {
    body.replaceChildren(from, el("p", { text: info.self ? "這是你自己產生的邀請連結，把它傳給朋友就好。" : "你們已經是好友了。" }));
    asking = false;
    return;
  }
  const say = el("div", { class: "say", role: "status" });
  body.replaceChildren(from, el("p", { text: `${info.from.name} 邀請你成為好友。接受後，你們預設可以看到彼此的角色（遊戲截圖除外，聊天內容一律看不到）。之後可以在「好友」裡調整要分享什麼，或隨時移除好友。` }),
    el("div", { class: "acts" }, button2("不要", done),
      button2("接受", async () => { try { await friendCall("POST", "/accept", { code }); done(); friendsPanel(); } catch (e) { say.textContent = e.message; } }, "go")),
    say);
}

// A small map of where one NPC or object spawns; the busiest zone first, the player's own zone preferred.
function miniMap(kind, id) {
  const canvas = el("canvas", { role: "img", "aria-label": "出沒位置圖" });
  const chips = el("div", { class: "chips" }), cap = el("div", { class: "small" });
  const box = el("div", { class: "mini" }, chips, canvas, cap);
  (async () => {
    try {
      const path = `/world/spawns?kind=${kind}&id=${id}`;
      if (!W.cache.has(path)) W.cache.set(path, await get(path));
      const data = W.cache.get(path);
      if (!data.zones.length) { box.replaceChildren(el("div", { text: "沒有已知的出沒位置（可能在副本裡，或資料庫還沒有紀錄）。" })); return; }
      const me = state.me;
      let cur = (data.zones.find(z => me && z.map_id === me.map_id) || data.zones[0]).map_id;
      const draw = async () => {
        const zone = data.zones.find(z => z.map_id === cur), img = await mapImage(cur);
        if (!canvas.isConnected || !canvas.clientWidth) return;
        const dpr = window.devicePixelRatio || 1, Wd = canvas.clientWidth, Hd = Wd * 2 / 3;
        canvas.width = Wd * dpr; canvas.height = Hd * dpr;
        const g = canvas.getContext("2d");
        g.scale(dpr, dpr);
        if (img) { g.drawImage(img, 0, 0, Wd, Hd); g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(0, 0, Wd, Hd); }
        else {
          g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
          for (let v = 10; v < 100; v += 10) { g.beginPath(); g.moveTo(v / 100 * Wd, 0); g.lineTo(v / 100 * Wd, Hd); g.moveTo(0, v / 100 * Hd); g.lineTo(Wd, v / 100 * Hd); g.stroke(); }
        }
        const pts = data.spawns.filter(p => p.map_id === cur);
        for (const p of pts) {
          g.beginPath(); g.arc(p.x / 100 * Wd, p.y / 100 * Hd, 4, 0, 7);
          g.fillStyle = "rgba(255,170,40,.9)"; g.fill(); g.lineWidth = 1.2; g.strokeStyle = "rgba(0,0,0,.85)"; g.stroke();
        }
        const here = me && me.map_id === cur && typeof me.x === "number";
        if (here) {
          g.beginPath(); g.arc(me.x / 100 * Wd, me.y / 100 * Hd, 6, 0, 7);
          g.fillStyle = "rgb(255,77,141)"; g.fill(); g.lineWidth = 2; g.strokeStyle = "#fff"; g.stroke();
        }
        cap.textContent = `${zone.zone || "地圖 " + cur}：${zone.spawns} 個出沒點（橘點）` + (pts.length < zone.spawns ? `，圖上顯示 ${pts.length} 個` : "")
          + (here ? "，粉紅點是你的位置" : "") + (img ? "" : "。這張地圖沒有底圖，只畫出座標格線") + "。";
      };
      if (data.zones.length > 1) {
        for (const z of data.zones.slice(0, 8)) {
          const b = el("button", { class: "chip", type: "button", "aria-pressed": z.map_id === cur, text: `${z.zone || z.map_id}（${z.spawns}）` });
          b.addEventListener("click", () => { cur = z.map_id; for (const c of chips.children) c.setAttribute("aria-pressed", c === b); draw(); });
          chips.append(b);
        }
      }
      requestAnimationFrame(draw);
    } catch (e) { box.replaceChildren(el("div", { text: "讀取位置失敗：" + e.message })); }
  })();
  return box;
}

// A full-screen viewer for a list of pictures; srcOf(item) resolves to an image address.
function lightbox(items, index, srcOf, captionOf) {
  const img = el("img", { alt: "" }), cap = el("div", { class: "cap" });
  const prev = el("button", { type: "button", text: "‹ 上一張" }), next = el("button", { type: "button", text: "下一張 ›" }), close = el("button", { type: "button", text: "關閉" });
  const box = el("div", { class: "lightbox", role: "dialog", "aria-label": "截圖" }, img, cap, el("div", { class: "bar" }, prev, close, next));
  const show = async k => {
    index = (k + items.length) % items.length;
    cap.textContent = captionOf(items[index]) + `　（${index + 1} / ${items.length}）`;
    img.style.opacity = ".4";
    const src = await srcOf(items[index]);
    if (src) img.src = src;
    img.style.opacity = "1";
  };
  const done = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") done(); else if (e.key === "ArrowLeft") show(index - 1); else if (e.key === "ArrowRight") show(index + 1); };
  prev.addEventListener("click", e => { e.stopPropagation(); show(index - 1); });
  next.addEventListener("click", e => { e.stopPropagation(); show(index + 1); });
  close.addEventListener("click", done);
  box.addEventListener("click", e => { if (e.target === box) done(); });
  document.addEventListener("keydown", onKey);
  prev.hidden = next.hidden = items.length < 2;
  document.body.append(box);
  show(index);
}

// XP per hour over the last 30 minutes of the most recent grinding stretch (needs 5+ minutes).
function xpRate(points) {
  if (points.length < 2) return null;
  const pts = points.map(([t, a]) => [new Date(t).getTime(), a]);
  const end = pts[pts.length - 1][0];
  let k = pts.length - 1;
  while (k > 0 && end - pts[k - 1][0] <= 1800000 && pts[k][0] - pts[k - 1][0] <= 300000) k--;
  const span = end - pts[k][0];
  if (span < 300000) return null;
  const gained = pts.slice(k + 1).reduce((s, p) => s + p[1], 0);
  return gained / (span / 3600000);
}

// Cumulative XP as a step line; long breaks stay flat.
function drawXp(canvas, points) {
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--muted").trim(), line = css.getPropertyValue("--line").trim();
  const accent = css.getPropertyValue("--accent").trim();
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.font = "11px sans-serif"; g.fillStyle = ink;
  if (!points.length) {
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("這段期間沒有獲得經驗", W / 2, H / 2);
    return;
  }
  const pts = points.map(([t, a]) => [new Date(t).getTime(), a]);
  const t0 = pts[0][0] - 60000, t1 = Math.max(pts[pts.length - 1][0], t0 + 120000);
  const total = pts.reduce((s, p) => s + p[1], 0);
  const L = 8, Rr = 8, T = 16, B = 20;
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - Rr), Y = v => T + (1 - v / total) * (H - T - B);
  g.strokeStyle = line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - Rr, Y(0)); g.stroke();
  g.beginPath(); g.moveTo(X(t0), Y(0));
  let sum = 0;
  for (const [t, a] of pts) { g.lineTo(X(t), Y(sum)); sum += a; g.lineTo(X(t), Y(sum)); }
  g.lineTo(X(t1), Y(sum));
  g.strokeStyle = accent; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
  g.lineTo(X(t1), Y(0)); g.closePath(); g.globalAlpha = 0.12; g.fillStyle = accent; g.fill(); g.globalAlpha = 1;
  g.fillStyle = ink; g.textBaseline = "top";
  const fmt = t => new Date(t).toLocaleString("zh-TW", t1 - t0 > 86400000
    ? { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }
    : { hour: "2-digit", minute: "2-digit", hour12: false });
  g.textAlign = "left"; g.fillText(fmt(pts[0][0]), L, H - B + 5);
  g.textAlign = "right"; g.fillText(fmt(t1), W - Rr, H - B + 5);
  g.textBaseline = "bottom"; g.fillText("+" + total.toLocaleString(), W - Rr, Y(total) - 2);
}

function describe(e) {
  const p = e.payload || {};
  const where = [p.zone_name, pos(p) !== "—" ? pos(p) : null].filter(Boolean).join("  ");
  if (e.event_type === "LEVEL_UP") return "升到 " + p.level + " 級";
  const at = where ? "　" + where : "";
  if (e.event_type.startsWith("QUEST_")) return (p.quest_name || "任務 #" + p.quest_id)
    + (e.event_type === "QUEST_REMOVED" ? "（放棄或失敗）" : "") + at;
  if (e.event_type === "ITEM_LOOTED") return (p.item_name || "物品 #" + p.item_id) + (p.count > 1 ? " ×" + p.count : "") + at;
  if (e.event_type === "MOB_KILLED") return (p.monster_name || "怪物 #" + p.monster_id) + (p.killed_by ? `（${p.killed_by} 擊殺）` : "") + at;
  if (e.event_type === "PARTY_LOOT") return `${p.looter || "隊友"}：${p.item_name || "物品 #" + p.item_id}` + (p.count > 1 ? " ×" + p.count : "");
  if (e.event_type === "PARTY_MEMBER_DIED") return (p.name || "隊友") + at;
  if (e.event_type === "GROUP_MEMBER_LEVEL_UP") return `${p.name || "隊友"} 升到 ${p.level} 級`;
  if (e.event_type === "PARTY_POSITIONS") return Object.keys(p.members || {}).join("、");
  if (e.event_type === "GROUP_METER") return "傷害 " + Object.values(p.damage || {}).reduce((a, b) => a + b, 0).toLocaleString();
  if (e.event_type === "GROUP_JOINED") return "和 " + (list(p.members).map(m => m.name).join("、") || "隊友") + at;
  if (e.event_type === "GROUP_MEMBER_JOINED" && p.update) return `${p.name || ""}（等級確認為 ${p.level}）`;
  if (e.event_type === "GROUP_MEMBER_JOINED" || e.event_type === "GROUP_MEMBER_LEFT") return p.name || "";
  if (e.event_type === "GROUP_LEFT") return "持續 " + duration(p.duration || 0);
  if (e.event_type === "MONEY_CHANGED") return (p.delta > 0 ? "+" : "−") + money(Math.abs(p.delta)) + "（餘 " + money(p.total) + "）";
  if (e.event_type === "XP_GAINED") return "+" + p.amount + " 經驗" + at;
  if (e.event_type === "SKILL_UP") return p.text || "";
  if (e.event_type === "COMBAT") return "持續 " + duration(p.duration || 0) + at;
  if (e.event_type === "TRADE_COMPLETED") {
    const side = s => s ? [...(s.items || []).map(i => (i.name || "物品 " + i.item_id) + (i.count > 1 ? " x" + i.count : "")), s.money ? money(s.money) : null].filter(Boolean).join("、") || "沒有" : "沒有";
    // an item handed over only to be enchanted comes back: said as the enchanting, not as given
    const ench = [[p.gave, "請對方附魔我的"], [p.got, "幫對方附魔"]].filter(([x]) => x && x.not_traded)
      .map(([x, verb]) => `${verb} ${x.not_traded.name}` + (x.not_traded.enchantment ? `（${x.not_traded.enchantment}）` : ""));
    const traded = side(p.gave) !== "沒有" || side(p.got) !== "沒有";
    return "和 " + (p.with || "對方") + "：" + [ench.join("、"), traded || !ench.length ? "給出 " + side(p.gave) + "；收到 " + side(p.got) : ""].filter(Boolean).join("　") + at;
  }
  if (e.event_type === "THREAT") return (p.mob_name || "目標") + "　" + (p.samples ? p.samples.split(";").length : 0) + " 筆仇恨讀數";
  if (e.event_type === "INSTANCE_ENTERED" || e.event_type === "INSTANCE_LEFT") return (p.name || "副本 " + p.instance_id) + (p.difficulty ? "（" + p.difficulty + "）" : "");
  if (e.event_type === "ENCOUNTER_END") return (p.name || "首領 " + p.encounter_id) + (p.success ? "　擊敗" : "　失敗");
  if (e.event_type === "NPC_INTERACTION") return (NPC_KIND[p.kind] || p.kind) + (p.npc_name ? "：" + p.npc_name : "") + at;
  if (e.event_type === "ACHIEVEMENT_EARNED") return p.name || "成就 #" + p.achievement_id;
  if (e.event_type === "FLIGHT_STARTED" || e.event_type === "FLIGHT_ENDED") return where || "";
  if (e.event_type === "CHAT_MESSAGE") return `[${CHANNEL[p.channel_type] || p.channel_type}] ${p.sender || ""}：${p.message || ""}`;
  if (e.event_type === "MAP_SCREENSHOT") return (p.map_name || "地圖 " + p.map_id);
  if (e.event_type === "PLAYER_DIED") return (where || "位置不明");
  if (e.event_type === "SESSION_START") return "等級 " + (p.level ?? "—") + "，插件 " + (p.addon_version ?? "—");
  return where || JSON.stringify(p);
}

// ---- route view -------------------------------------------------------------
const R = { mode: "fit", view: "journey", span: null, playing: false, p: 1, markers: new Map() };
const GAP = 300000;          // a pause longer than this breaks the line (logout, hearth, other map)
const OLD = [57, 208, 255], FRESH = [255, 77, 141];
const mix = t => `rgb(${OLD.map((c, k) => Math.round(c + (FRESH[k] - c) * t)).join(",")})`;

// Cumulative path length (map art is 3:2, so x counts 1.5x) with gaps contributing nothing.
function buildModel(pts) {
  const cum = [0], gap = [false];
  for (let k = 1; k < pts.length; k++) {
    const g = pts[k].t - pts[k - 1].t > GAP;
    gap.push(g);
    cum.push(cum[k - 1] + (g ? 0 : Math.hypot((pts[k].x - pts[k - 1].x) * 1.5, pts[k].y - pts[k - 1].y)));
  }
  return { pts, cum, gap, total: cum[cum.length - 1] || 0 };
}

// A square window in map percent units has the map's own aspect ratio.
function computeView(pts, mode) {
  if (mode === "full" || !pts.length) return { x0: 0, y0: 0, span: 100 };
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const span = Math.min(100, Math.max(18, Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) * 1.4));
  const lo = c => Math.min(Math.max(c - span / 2, 0), 100 - span);
  return { x0: lo((Math.max(...xs) + Math.min(...xs)) / 2), y0: lo((Math.max(...ys) + Math.min(...ys)) / 2), span };
}

function mapMarkers(id) {

      : Promise.resolve({ items: [] }))

        .filter(m => typeof m.x === "number" && typeof m.y === "number"
          && ["MOB_KILLED", "PLAYER_DIED", "QUEST_ACCEPTED", "QUEST_COMPLETED"].includes(m.type)))
      .catch(() => []));

function drawRoute(canvas, model, img, view, d, marks, hover, heat) {
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--muted").trim(), line = css.getPropertyValue("--line").trim();
  const ratio = img ? img.naturalHeight / img.naturalWidth : 2 / 3;
  canvas.style.aspectRatio = `1 / ${ratio}`;
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = W * ratio;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  const X = v => (v - view.x0) / view.span * W, Y = v => (v - view.y0) / view.span * H;
  if (img) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    g.imageSmoothingQuality = "high";
    g.drawImage(img, view.x0 / 100 * iw, view.y0 / 100 * ih, view.span / 100 * iw, view.span / 100 * ih, 0, 0, W, H);
    g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(0, 0, W, H);       // dim the art so the route stands out
  } else {
    g.font = "11px sans-serif"; g.fillStyle = ink; g.strokeStyle = line; g.lineWidth = 1;
    const step = view.span > 50 ? 20 : view.span > 20 ? 10 : 5;
    for (let v = Math.ceil(view.x0 / step) * step; v <= view.x0 + view.span; v += step) {
      g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), H); g.stroke();
      g.textAlign = "left"; g.textBaseline = "top"; g.fillText(v, X(v) + 3, 3);
    }
    for (let v = Math.ceil(view.y0 / step) * step; v <= view.y0 + view.span; v += step) {
      g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(W, Y(v)); g.stroke();
      g.textAlign = "left"; g.textBaseline = "bottom"; g.fillText(v, 3, Y(v) - 2);
    }
  }
  const { pts, cum, gap, total } = model;
  if (!pts.length) return;

  // How far along the path we are: n = last point fully reached, head = interpolated position.
  let n = 0;
  while (n + 1 < pts.length && cum[n + 1] <= d) n++;
  let head = pts[n];
  if (n + 1 < pts.length && d > cum[n] && cum[n + 1] > cum[n]) {
    const f = (d - cum[n]) / (cum[n + 1] - cum[n]), a = pts[n], b = pts[n + 1];
    head = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, t: a.t + (b.t - a.t) * f };
  }
  const segs = [];
  for (let k = 1; k <= n; k++) if (!gap[k]) segs.push([pts[k - 1], pts[k], cum[k]]);
  if (head !== pts[n]) segs.push([pts[n], head, d]);

  if (heat) {                      // heat layer: overlapping blobs add up where more time or kills pile up
    const maxW = Math.max(...heat.map(h => h.w), 1), r = Math.max(16, W / 20);
    for (const h of heat) {
      const cx = X(h.x), cy = Y(h.y), a = 0.12 + 0.4 * h.w / maxW;
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, `rgba(255,60,20,${a})`);
      grad.addColorStop(0.6, `rgba(255,170,0,${a * 0.5})`);
      grad.addColorStop(1, "rgba(255,200,0,0)");
      g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    }
    return;
  }
  g.lineJoin = "round"; g.lineCap = "round";
  g.strokeStyle = "rgba(0,0,0,.7)"; g.lineWidth = 7;
  for (const [a, b] of segs) { g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke(); }
  g.lineWidth = 3.5;
  for (const [a, b, c] of segs) {
    g.strokeStyle = mix(total ? c / total : 1);
    g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke();
  }
  // Direction arrows roughly every 70px along the path.
  let run = 35;
  for (const [a, b] of segs) {
    const ax = X(a.x), ay = Y(a.y), bx = X(b.x), by = Y(b.y), len = Math.hypot(bx - ax, by - ay);
    run += len;
    if (run < 70 || len < 10) continue;
    run = 0;
    const ang = Math.atan2(by - ay, bx - ax);
    g.save(); g.translate((ax + bx) / 2, (ay + by) / 2); g.rotate(ang);
    g.beginPath(); g.moveTo(7, 0); g.lineTo(-5, -5.5); g.lineTo(-5, 5.5); g.closePath();
    g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.8)"; g.lineWidth = 1.5; g.fill(); g.stroke();
    g.restore();
  }
  // Things that happened along the way (only those already reached during playback).
  g.textAlign = "center"; g.textBaseline = "middle"; g.lineWidth = 3; g.strokeStyle = "rgba(0,0,0,.85)";
  for (const m of marks) {
    if (m.t > head.t + 1000 || m.t < pts[0].t - 1000) continue;
    const [glyph, color, size] = m.type === "MOB_KILLED" ? ["✕", "#ff6b6b", 12]
      : m.type === "PLAYER_DIED" ? ["☠", "#fff", 18] : ["!", "#ffe066", 16];
    g.font = `bold ${size}px sans-serif`;
    g.strokeText(glyph, X(m.x), Y(m.y)); g.fillStyle = color; g.fillText(glyph, X(m.x), Y(m.y));
  }
  const dot = (p, r, fill) => {
    g.beginPath(); g.arc(X(p.x), Y(p.y), r, 0, 7); g.fillStyle = fill; g.fill();
    g.lineWidth = 2; g.strokeStyle = "#fff"; g.stroke();
  };
  dot(pts[0], 4.5, "rgb(" + OLD.join(",") + ")");
  dot(head, 7, "rgb(" + FRESH.join(",") + ")");
  if (hover) { g.beginPath(); g.arc(X(hover.x), Y(hover.y), 9, 0, 7); g.lineWidth = 2; g.strokeStyle = "#fff"; g.stroke(); }
  if (d < total) {                                               // clock while playing or scrubbing
    const label = full(new Date(head.t).toISOString());
    g.font = "12px sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
    const tw = g.measureText(label).width;
    g.fillStyle = "rgba(0,0,0,.7)"; g.fillRect(8, 8, tw + 16, 24);
    g.fillStyle = "#fff"; g.fillText(label, 16, 20);
  }
}

// Quest pins from the world database: "?" where a quest is handed in, dots where its targets spawn.
function drawPins(canvas, view, pins, hot) {

  for (const p of pins) {

  }

    g.fillStyle = p.complete ? "#ffd43b" : "#adb5bd"; g.fill(); g.lineWidth = 2; g.strokeStyle = "rgba(0,0,0,.85)"; g.stroke();
    g.fillStyle = "#1a1a1a"; g.fillText("?", X(p.x), Y(p.y) + 1);

}

        el("a", { href: url, target: "_blank", rel: "noopener", class: "wname", style: "color:inherit", text: (g.zone_name || "練功") + (g.ongoing ? "（進行中）" : "") }),
        el("span", { class: "obj", text: `${new Date(g.started_at).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })}`
          + `　${duration(g.duration).replace(/ \d+ 秒$/, "")}　擊殺 ${g.kills}　經驗 ${g.xp.toLocaleString()}` + (g.damage ? `　傷害 ${g.damage.toLocaleString()}` : "") })));
    }), "還沒有單人的戰鬥紀錄。要開著遊戲的戰鬥紀錄（/combatlog）練功，存檔並同步後這裡就會出現。");

    // ---- quests by zone: what is done, what is left, and what is worth doing now
    let zonesCard = null, zoneCard = null;
    if (W.ok && zones && zones.items.length) {
      const hereId = d.map_id;
      if (!zones.items.some(z => z.map_id === state.questZone)) {
        state.questZone = (zones.items.find(z => z.map_id === hereId) || zones.items.find(z => z.available) || zones.items[0]).map_id;
      }
      zoneCard = el("section", { class: "card c-map" });
      const fillZone = async () => {
        const id = state.questZone;
        zoneCard.replaceChildren(el("div", { class: "loading", role: "status" }, el("i"), "讀取這一區的任務…"));
        try {
          const path = `/world/zone-quests?character_id=${cid}&map_id=${id}`;
          const z = await get(path);
          if (id !== state.questZone) return;
          const by = s => z.items.filter(q => q.state === s);
          const row = q => {
            const xp = el("span", { class: "num xp" });
            if (q.xp) { if (q.xp_share < 1) xp.append(el("s", { text: q.xp.toLocaleString() })); xp.append(q.xp_now.toLocaleString() + " 經驗" + (q.xp_confirmed ? "" : "＊")); }
            const sub = q.state === "locked" && q.needs.length ? "要先完成：" + q.needs.map(n => n.name || "#" + n.id).join("、")
              : [q.start && q.start.name ? "起點：" + q.start.name + (q.start.location ? `（${at(q.start.location)}）` : "") : null,
                 q.rewards.length ? "獎勵：" + q.rewards.map(r => r.name || "#" + r.id).join("、") : null].filter(Boolean).join("　");
            return el("li", null, expandable("zq" + q.id, [el("span", { class: "grow" }, el("span", { class: "wname" + (q.state === "completed" ? " done" : ""), text: q.name }),
              sub ? el("span", { class: "obj", text: sub }) : null),
              el("span", { class: "num", text: (q.level > 0 ? q.level + " 級" : "") + (q.state === "too_low" ? `（需 ${q.min_level}）` : "") }), xp],
              "/world/quests/" + q.id, questDetail));
          };
          const group = (title, rows, openByDefault) => {
            if (!rows.length) return null;
            const key = "zg" + id + title, det = el("details", null, el("summary", { class: "wsec", text: `${title}（${rows.length}）` }), el("ul", { class: "rows" }, ...rows.map(row)));
            det.style.marginBottom = "6px"; det.firstChild.style.cursor = "pointer";
            det.open = W.groups ? (W.groups.has(key) ? W.groups.get(key) : openByDefault) : openByDefault;
            det.addEventListener("toggle", () => { (W.groups = W.groups || new Map()).set(key, det.open); });
            return det;
          };
          const done = by("completed").length, total = z.items.length;
          const worth = by("available").reduce((s, q) => s + q.xp_now, 0);
          zoneCard.replaceChildren(...[
            el("div", { class: "cardhead" }, el("h2", { text: `${z.zone || "地圖 " + id} 的任務` }),
              el("span", { class: "small", text: `完成 ${done} / ${total}` })),
            z.known ? null : el("div", { class: "note", text: "還沒有完整的「已完成任務」清單，所以下面的「現在可接」可能包含你其實做過的任務。更新插件後重新登入並存檔一次就會準確。" }),
            el("div", { class: "small", text: by("available").length ? `現在可接的 ${by("available").length} 個任務全做完大約是 ${worth.toLocaleString()} 經驗`
              + (typeof d.xp === "number" && d.xp_max > 0 ? `（升級還差 ${(d.xp_max - d.xp).toLocaleString()}）。` : "。") + "依你現在等級實際能拿的經驗排序。" : "這一區沒有現在可接的任務。" }),
            group("現在可接", by("available"), true), group("進行中", by("in_log"), true),
            group("等級不足", by("too_low"), false), group("要先完成前置任務", by("locked"), false), group("已完成", by("completed"), false),
            el("div", { class: "small", text: "劃掉的數字是原本的經驗，任務比你低 6 級以上會打折。＊ 是經典版數值，Forever 實際可能更高。資料庫的種族、陣營設定未必完全正確，少數任務你可能接不到。" })].filter(Boolean));
        } catch (e) { zoneCard.replaceChildren(el("div", { class: "msg", text: "讀取失敗：" + e.message })); }
      };
      const zoneRows = zones.items.map(z => {
        const li = el("li", { class: "zone" + (z.map_id === state.questZone ? " sel" : "") + (z.map_id === hereId ? " here" : ""), tabindex: "0", role: "button" },
          el("span", { class: "grow" }, el("span", { text: z.zone }),
            el("span", { class: "obj", text: (z.level_min ? `${z.level_min}–${z.level_max} 級　` : "") + (z.available ? `可接 ${z.available}` : "沒有可接的") + (z.in_log ? `　進行中 ${z.in_log}` : "") })),
          (() => { const b = el("span", { class: "zbar", role: "img", "aria-label": `完成 ${z.completed}，共 ${z.total}` });
            for (const [c, n] of [["d", z.completed], ["l", z.in_log], ["a", z.available]]) { const i = el("i", { class: c }); i.style.width = (n / z.total * 100) + "%"; b.append(i); }
            return b; })(),
          el("span", { class: "num", text: `${z.completed}/${z.total}` }));
        const pick = () => { state.questZone = z.map_id; for (const n of li.parentElement.children) n.classList.toggle("sel", n === li); fillZone(); };
        li.addEventListener("click", pick);
        li.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
        return li;
      });
      zonesCard = section("c-events", "各區任務進度", zones.known ? "點一區看還有哪些沒做" : "尚無完整紀錄", zoneRows, "");
      zonesCard.append(el("div", { class: "small", text: "綠色是已完成，橘色是進行中，淺色是現在可接。只算你的種族與職業接得到、非節慶、非重複的任務。" }));
      fillZone();
    }
    const only = (part, ...nodes) => has(part) ? nodes : [];
    const layout = { home: [...only("activity", summaryCard, evCard), ...only("location", nearCard), ...only("activity", monsterCard), ...(has("items") ? only("activity", itemCard) : []),
      ...only("groups", groupCard, soloCard)], map: only("location", mapCard, fpCard), quests: only("quests", questCard, zonesCard, zoneCard),
      items: only("items", equipCard, bagCard, bankCard), char: [charCard, ...only("character", attrCard, profCard, repCard)],
      album: only("screenshots", albumCard), data: [W.ok ? searchCard() : null, ...only("activity", statCard), foot] };
    const cards = [];
    for (const [name, nodes] of Object.entries(layout)) for (const n of nodes) if (n) { n.dataset.tab = name; cards.push(n); }
    const bar = el("nav", { class: "tabs", role: "tablist", "aria-label": "區塊" });
    const showTab = name => {
      state.tab = name;
      try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* not remembered */ }
      for (const b of bar.children) b.setAttribute("aria-selected", b.dataset.tab === name);
      for (const n of cards) n.classList.toggle("on", n.dataset.tab === name);
      if (state.redraw) state.redraw();              // canvases cannot draw while hidden
    };
    const shownTabs = TABS.filter(([name]) => layout[name] && layout[name].some(Boolean));
    if (!shownTabs.some(([name]) => name === state.tab)) state.tab = shownTabs.length ? shownTabs[0][0] : "home";
    for (const [name, label] of shownTabs) {
      const b = el("button", { type: "button", role: "tab", "data-tab": name, text: label });
      b.addEventListener("click", () => { showTab(name); bar.scrollIntoView({ block: "nearest" }); });
      bar.append(b);
    }
    fpCard.classList.replace("c-half", "c-events");
    state.redraw = () => { if (xpCanvas.clientWidth) drawXp(xpCanvas, act.xp_points); if (window.onresize) window.onresize(); };
    const y = window.scrollY;
    let note = state.parts && !state.friend ? el("div", { class: "card sharenote", text: "這是分享的檢視：擁有者只開放了部分內容。" }) : null;
    if (state.friend) {
      const back = el("button", { type: "button", text: "回到我的角色" });
      back.addEventListener("click", leaveFriend);
      note = el("div", { class: "card friendbar" }, "正在看 ", el("b", { text: state.friend.name }), " 分享給你的角色", back);
    }
    // every character this token holds, one button each: the page shows one at a time
    let picker = null;
    if (chars.length > 1) {
      picker = el("nav", { class: "chars", "aria-label": "切換角色" });
      for (const c of chars) {
        const b = el("button", { type: "button", "aria-pressed": c.id === state.charId,
          title: [c.realm, CLASS[c.class] || c.class].filter(Boolean).join(" · ") }, el("i"), shownName(c),
          c.level ? el("small", { text: "Lv " + c.level }) : null);
        if (CLASS_COLOR[c.class]) b.style.setProperty("--cls", CLASS_COLOR[c.class]);
        b.addEventListener("click", () => {
          if (c.id === state.charId) return;
          state.charId = c.id;
          state.mapId = null; state.questZone = null;    // the other character's own map and quests
          if (!state.friend) try { localStorage.setItem(CHAR_KEY, c.id); } catch (e) { /* this visit only */ }
          for (const x of picker.children) x.setAttribute("aria-pressed", x === b);
          load();
        });
        picker.append(b);
      }
    }
    app.replaceChildren(...[note, picker, hero, bar, el("div", { class: "grid" }, ...cards)].filter(Boolean));
    showTab(state.tab);
    window.scrollTo(0, y);                           // a refresh must not move the page
    if (session && !quiet) askAboutInvite();
  } catch (err) {
    if (err.message === "auth" && state.friend) {      // no longer friends, or nothing shared any more
      leaveFriend();
      return;
    }
    if (err.message === "auth") return showLogin(!session, await whoAmI());   // a session that lapsed is no wrong token
    const again = el("button", { type: "button", text: "重試" });
    again.addEventListener("click", () => { app.replaceChildren(el("div", { class: "loading", role: "status" }, el("i"), "重新載入中…")); load(); });
    app.replaceChildren(el("div", { class: "card msg" }, "無法讀取資料：" + (err.message === "Failed to fetch" ? "連不上伺服器" : err.message), el("div", null, again)));
  } finally {
    clearTimeout(slow);
    busy.classList.remove("on");
  }
}

load();
window.addEventListener("resize", () => { if (state.redraw) state.redraw(); });
// Background refresh, but never while someone is typing, choosing from a menu or watching the route play.
setInterval(() => {
  const busy = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if ((token || session) && !document.hidden && !R.playing && !busy) load(true);
}, 30000);
</script>
</body>
</html>
